services:
  - type: web
    name: party-games
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # Render 대시보드에서 직접 입력
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
