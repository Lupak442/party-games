<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: radial-gradient(circle at 50% 20%, #f3e8ff 0%, #ede9fe 40%, #f8fafc 100%);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    padding-top: 110px;
  }
  .header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }
  .badge-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 34px;
    background: #ffffff;
    border-radius: 999px;
    font-size: 26px;
    font-weight: 800;
    color: #7c3aed;
    box-shadow: 0 8px 24px rgba(124, 58, 237, 0.12);
    border: 1.5px solid rgba(124, 58, 237, 0.18);
    margin-bottom: 24px;
  }
  .headline {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.26;
    color: #0f172a;
    letter-spacing: -1.5px;
  }
  .highlight {
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 30px;
    font-weight: 600;
    color: #64748b;
    margin-top: 16px;
    letter-spacing: -0.5px;
  }

  /* 스마트폰 프레임 목업 */
  .phone-frame {
    width: 760px;
    height: 1460px;
    margin-top: 60px;
    background: #09061c;
    border-radius: 64px;
    border: 14px solid #1e1b4b;
    box-shadow: 0 40px 100px rgba(79, 70, 229, 0.25), 0 10px 30px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .phone-top-bar {
    height: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 36px;
    font-size: 18px;
    color: #94a3b8;
    font-weight: 700;
    z-index: 10;
  }
  .phone-content {
    flex: 1;
    padding: 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .room-header {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px;
    padding: 24px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .room-id-box small { font-size: 16px; color: #94a3b8; font-weight: 700; display: block; }
  .room-id-box b { font-size: 36px; color: #fbbf24; letter-spacing: 4px; font-weight: 900; }
  .btn-share-big {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #2b1300;
    font-size: 22px;
    font-weight: 900;
    padding: 16px 28px;
    border-radius: 18px;
    border: none;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 24px rgba(245, 158, 11, 0.4);
  }
  .invite-card {
    background: linear-gradient(145deg, rgba(124,58,237,0.25), rgba(236,72,153,0.15));
    border: 1.5px solid rgba(168,85,247,0.4);
    border-radius: 32px;
    padding: 32px 28px;
    text-align: center;
  }
  .invite-card .icon-pop { font-size: 56px; margin-bottom: 12px; }
  .invite-card h2 { font-size: 30px; color: #fff; font-weight: 900; margin-bottom: 10px; }
  .invite-card p { font-size: 20px; color: #cbd5e1; line-height: 1.5; }
  .link-box {
    margin-top: 20px;
    background: rgba(0,0,0,0.4);
    border: 1px dashed rgba(251,191,36,0.6);
    border-radius: 16px;
    padding: 16px;
    font-size: 20px;
    color: #fbbf24;
    font-weight: 800;
    word-break: break-all;
  }
  .player-list-title {
    font-size: 24px;
    font-weight: 800;
    color: #e2e8f0;
    margin: 8px 0 0;
    display: flex;
    justify-content: space-between;
  }
  .player-chips {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .player-chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: #fff;
    font-size: 22px;
    font-weight: 800;
  }
  .player-chip.host {
    border-color: #f59e0b;
    background: rgba(245,158,11,0.12);
  }
  .p-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: linear-gradient(135deg, #a855f7, #6366f1);
  }
</style>
</head>
<body>
  <div class="header">
    <div class="badge-pill">👑 방장만 앱 설치</div>
    <h1 class="headline">친구들은 설치 없이<br/><span class="highlight">링크 하나로 즉시 입장</span></h1>
    <p class="subtitle">초대 링크만 공유하면 웹 브라우저에서 바로 함께 즐겨요</p>
  </div>

  <div class="phone-frame">
    <div class="phone-top-bar">
      <span>12:34</span>
      <span>📶 5G 100%</span>
    </div>
    <div class="phone-content">
      <div class="room-header">
        <div class="room-id-box">
          <small>초대코드</small>
          <b>7X9KQ</b>
        </div>
        <button class="btn-share-big">🔗 링크 공유하기</button>
      </div>

      <div class="invite-card">
        <div class="icon-pop">📲🎉</div>
        <h2>친구들을 파티에 초대하세요!</h2>
        <p>친구들은 앱을 설치할 필요가 없어요.<br/>링크만 누르면 스마트폰 웹으로 즉시 들어옵니다!</p>
        <div class="link-box">https://party-games-cxo2.onrender.com/?room=7X9KQ</div>
      </div>

      <div class="player-list-title">
        <span>현재 참여 인원</span>
        <span style="color:#fbbf24;">4명 접속 중</span>
      </div>
      <div class="player-chips">
        <div class="player-chip host"><div class="p-avatar">👑</div><span>나(방장)</span></div>
        <div class="player-chip"><div class="p-avatar" style="background:#ec4899;">지</div><span>지은이</span></div>
        <div class="player-chip"><div class="p-avatar" style="background:#3b82f6;">민</div><span>민준이</span></div>
        <div class="player-chip"><div class="p-avatar" style="background:#10b981;">수</div><span>수진이</span></div>
      </div>
    </div>
  </div>
</body>
</html>
